<style>:root{
  --forest:#15301f;--forest2:#1e4430;--moss:#2d5a3f;--gold:#e2b63a;--gold2:#c9971c;--cream:#f5f0e3;--paper:#fffdf7;
  --ink:#1b261f;--muted:#5d6b61;--line:#e1d9c4;--ok:#2e8b4f;--okbg:#e4f3e8;--bad:#c2412b;--badbg:#fbe7e2;--later:#d79a1d;
  --r:14px;--shadow:0 1px 2px rgba(21,48,31,.06),0 6px 20px rgba(21,48,31,.07);
  --serif:"Fraunces","Georgia","Cambria","Times New Roman",serif;--sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
body.booting{overflow:hidden}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  background:radial-gradient(120% 80% at 50% 35%,#2a5a3e 0%,#15301f 55%,#0c1d13 100%);color:#f3e7c2;transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(56vw,330px);height:auto;filter:drop-shadow(0 18px 40px rgba(0,0,0,.45));animation:rise 1.4s cubic-bezier(.2,.8,.2,1) both}
#splash .st{text-align:center;animation:fade 1.2s .6s both}
#splash .st b{display:block;font:600 clamp(20px,3.2vw,28px)/1.2 var(--serif);color:#fff}
#splash .st span{font-size:clamp(13px,1.6vw,15px);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#splash .ld{width:min(60vw,260px);height:3px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
#splash .ld i{display:block;height:100%;background:var(--gold);animation:load 5s linear both}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes load{from{width:0}to{width:100%}}

/* ---------- comune ---------- */
.eyebrow{margin:0 0 4px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.lead{color:var(--muted);margin:8px 0 0;max-width:62ch}
.hero{display:flex;gap:22px;align-items:center;margin-bottom:20px}
.hero-logo{width:96px;height:auto;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}
.hero h1{font-size:clamp(24px,3.4vw,34px);line-height:1.15}
.resume{display:block;width:100%;text-align:left;background:var(--forest);color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow)}
.resume b{display:block;color:var(--gold)} .resume span{font-size:14px;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi b{display:block;font:600 26px/1.1 var(--serif);color:var(--forest)} .kpi span{font-size:13px;color:var(--muted)}
.kpi i{position:absolute;left:0;bottom:0;height:4px;width:var(--p);background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
@media (hover:hover){.tile:hover{transform:translateY(-2px);border-color:var(--gold)}}
.tile b{font:600 18px/1.2 var(--serif);color:var(--forest)} .tile span:not(.ic){font-size:14px;color:var(--muted)}
.tile .ic{font-size:20px;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--cream);color:var(--forest);margin-bottom:6px}
.tile.big{grid-column:span 3;background:linear-gradient(120deg,var(--forest) 0%,var(--moss) 100%);color:#fff;border:0;padding:22px 24px}
.tile.big b{color:#fff;font-size:24px} .tile.big span:not(.ic){color:#dfe8de;font-size:15px} .tile.big .ic{background:var(--gold);color:var(--forest)}

.phead{margin-bottom:16px} .phead h1{font-size:28px} .phead p{color:var(--muted);margin:4px 0 10px}
.seg{display:inline-flex;background:#ebe4d1;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--forest);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg.wide{display:flex;flex-wrap:wrap} .seg.wide button{flex:1}
.chlist{display:grid;gap:8px}
.chrow{display:grid;grid-template-columns:90px 1fr auto;gap:2px 14px;align-items:center;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.chrow:hover{border-color:var(--gold)}
.chg{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2)}
.chn{font-weight:600;color:var(--forest)} .chc{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;display:block;height:5px;border-radius:5px;background:#ece5d2;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}

.sesh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sesh b{display:block;font-family:var(--serif);font-size:18px;color:var(--forest)} .sesh span{font-size:14px;color:var(--muted)}
.sesh em{font-style:normal;font-weight:700} .g{color:var(--ok)} .r{color:var(--bad)}
.back{width:40px;height:40px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font-size:24px;line-height:1;flex:none}
.prog{height:5px;background:#e6dfcb;border-radius:5px;overflow:hidden;margin-bottom:14px} .prog i{display:block;height:100%;background:var(--gold);transition:width .3s}

.qcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.qnum{font-weight:700;color:var(--forest)} .tag{background:var(--cream);border-radius:20px;padding:2px 10px} .qid{margin-left:auto}
.qtext{font-size:clamp(19px,2.2vw,23px);line-height:1.35;color:var(--ink);margin-bottom:14px}
.qimg{margin:0 0 14px;text-align:center} .qimg img{max-width:100%;max-height:340px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.qimg figcaption{font-size:12px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;transition:border-color .12s,background .12s}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--gold)}}
.opt .let{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--cream);color:var(--forest)}
.opt .txt{font-size:17px}
.opt.chosen{border-color:var(--forest);background:#eef3ee} .opt.chosen .let{background:var(--forest);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.ok .let{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)} .opt.bad .let{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.feedback{margin-top:12px}
.fb{font-weight:700;font-size:17px;margin:0 0 10px;padding:10px 14px;border-radius:10px} .fb.ok{background:var(--okbg);color:var(--ok)} .fb.bad{background:var(--badbg);color:var(--bad)}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px} .nav .pri{margin-left:auto} .nav.center{justify-content:center} .nav.center .pri{margin-left:0}
.btn{padding:11px 18px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-weight:600}
.btn:hover:not(:disabled){border-color:var(--forest)} .btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--forest);color:#fff;border-color:var(--forest)} .btn.pri:hover{background:var(--moss)}
.btn.ghost{background:transparent;border-style:dashed} .btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{background:var(--bad);color:#fff;border-color:var(--bad)}

/* examen */
.exhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.exttl{flex:1} .exttl b{display:block;font-family:var(--serif);font-size:20px;color:var(--forest)} .exttl span{font-size:14px;color:var(--muted)}
.timer{font:700 24px/1 ui-monospace,"SF Mono",Consolas,monospace;background:var(--forest);color:var(--gold);padding:8px 14px;border-radius:10px;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--bad);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
.grid p{margin:0 0 8px;font-weight:700;color:var(--forest)}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.cell.done{background:var(--forest);color:#fff;border-color:var(--forest)} .cell.later{background:#fbefd0;border-color:var(--later);color:#7a5408}
.cell.cur{outline:3px solid var(--gold);outline-offset:1px}
.legend{font-size:12px;font-weight:400!important;color:var(--muted)!important;margin-top:10px!important;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:#fff;margin-right:-6px} .lg.done{background:var(--forest)} .lg.later{background:#fbefd0;border-color:var(--later)}

/* rezultat */
.verdict{border-radius:18px;padding:26px;text-align:center;color:#fff;margin-bottom:16px}
.verdict.pass{background:linear-gradient(135deg,#1f6b3c,#15301f)} .verdict.fail{background:linear-gradient(135deg,#a8361f,#5a1d12)}
.vbadge{display:inline-block;font:700 15px var(--sans);letter-spacing:.2em;background:rgba(255,255,255,.16);padding:6px 16px;border-radius:30px}
.vscore b{font:600 72px/1 var(--serif)} .vscore span{display:block;opacity:.85}
.verdict p{max-width:52ch;margin:10px auto;opacity:.92}
.verdict .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)} .verdict .btn.pri{background:var(--gold);color:var(--forest);border-color:var(--gold)}
.perch{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin-bottom:16px}
.perch h3{font-size:19px;margin-bottom:8px;color:var(--forest)}
.pc{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 0;border-bottom:1px solid #f0ead9;font-size:15px} .pc:last-child{border:0}
.pc b{font-variant-numeric:tabular-nums} .pc small{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:3px}
.review .rvh{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:10px} .review h3{font-size:19px;color:var(--forest)}
.rv{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rv.okk{border-left-color:var(--ok)} .rv.badd{border-left-color:var(--bad)}
.rvn{flex:none;min-width:30px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rvb{flex:1;min-width:0} .rvq{margin:0 0 6px;font-weight:600} .rvq small{color:var(--muted);font-weight:400}
.rvo{margin:2px 0;padding:3px 8px;border-radius:6px;font-size:15px} .rvo.c{background:var(--okbg);color:#185c32;font-weight:600} .rvo.w{background:var(--badbg);color:var(--bad)}
.rv .qimg img{max-height:200px}
.hist{display:grid;gap:6px} .hrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;text-align:left;padding:9px 12px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:14px}
.hrow:hover{border-color:var(--gold)}
.sbar{display:flex;gap:8px;flex-wrap:wrap} .sbar input,.sbar select{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;min-width:0}
.sbar input{flex:2 1 240px} .sbar select{flex:1 1 200px}
.empty{text-align:center;padding:50px 20px} .empty h2{color:var(--forest);margin-bottom:8px}
.prose{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 24px 20px;max-width:780px}
.prose h3{margin:18px 0 6px;color:var(--forest);font-size:20px} .prose li{margin:4px 0}
.quota{display:flex;flex-wrap:wrap;gap:6px} .quota span{background:var(--cream);border-radius:8px;padding:3px 10px;font-size:14px}
.small{font-size:13px;color:var(--muted);margin-top:18px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,14,.5);display:grid;place-items:center;padding:20px;animation:fade .15s}
.mbox{background:var(--paper);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{color:var(--forest);font-size:21px} .mbox p{color:var(--muted)} .mbtn{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;border-radius:8px;background:#fff} .lightbox span{position:absolute;top:10px;right:18px;color:#fff;font-size:36px}

.btn.fb{background:#1877f2;color:#fff;border-color:#1877f2;display:inline-flex;align-items:center;gap:8px}
.btn.fb:hover{background:#0f63d1;border-color:#0f63d1}
.fbi{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#fff;color:#1877f2;font:700 15px/1 Arial,sans-serif;padding-top:3px}
.verdict .btn.fb{background:#1877f2;border-color:#1877f2;color:#fff}
.sharerow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:16px;padding:14px 18px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:80;background:var(--forest);color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:15px;max-width:90vw;transition:opacity .4s}
.toast.out{opacity:0}

.optin{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);font-size:14px;color:var(--muted);cursor:pointer}
.optin input{width:20px;height:20px;accent-color:var(--forest);flex:none;margin-top:1px}

html,body{background:var(--cream)}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--forest);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.topbar img{width:34px} .topbar b{font:600 16px/1.1 var(--serif);display:block} .topbar span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
#app{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;border-radius:10px}
.tabs button i{font-style:normal;font-size:20px;line-height:1.1}
.tabs button.on{color:var(--forest)} .tabs button.on i{background:var(--gold);border-radius:14px;padding:0 14px}
.hero{gap:14px} .hero-logo{width:64px} .hero h1{font-size:23px} .lead{font-size:14px}
.kpis{grid-template-columns:1fr 1fr;gap:8px} .kpi{padding:10px 12px} .kpi b{font-size:22px} .kpi span{font-size:12px}
.tiles{grid-template-columns:1fr 1fr;gap:8px} .tile{padding:13px} .tile b{font-size:16px} .tile span:not(.ic){font-size:12.5px}
.tile.big{grid-column:span 2;padding:18px} .tile.big b{font-size:21px}
.tile:hover{transform:none}
.qcard{padding:16px 14px;border-radius:16px} .qid{display:none} .qtext{font-size:19px}
.opt{padding:14px 12px;min-height:58px;-webkit-tap-highlight-color:transparent} .opt .txt{font-size:16.5px} .opt:active{transform:scale(.99)}
.nav{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 30%);padding-top:12px;margin-top:4px}
.nav .btn{flex:1;padding:13px 10px} .nav .btn.ghost{flex-basis:100%;order:-1;padding:9px}
.exam .exhead{position:sticky;top:calc(50px + env(safe-area-inset-top));z-index:10;background:var(--cream);padding:6px 0;margin:-6px 0 6px}
.exttl b{font-size:17px} .timer{font-size:20px;padding:7px 10px}
.exbody{display:flex;flex-direction:column;gap:14px}
.grid{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}
.cells{grid-template-columns:repeat(10,1fr);gap:5px} .cell{font-size:12px;border-radius:6px}
.chrow{grid-template-columns:64px 1fr auto;padding:12px} .chn{font-size:15px}
.verdict{padding:20px 14px} .vscore b{font-size:60px}
.phead h1{font-size:24px} .prose{padding:4px 16px 16px}
.hrow{grid-template-columns:1fr auto;font-size:13px} .hrow span:last-child{display:none}
.mbtn .btn{flex:1}

.verdict .nav,.empty .nav,.prose+.nav,.perch~.nav{position:static;background:none;padding-top:0}
.verdict .nav .fb{flex-basis:100%;justify-content:center}
</style></head>

":"VIII","q":"Vânătoarea la dibuit face parte din categoria:","o":["Metodelor de vânătoare individuală","Metodelor de vânătoare colectivă, în grup restrâns","Metodelor de vânătoare colectivă, în grup mare"],"a":0},{"n":934,"c":"VIII","q":"Vânătoarea la pândă face parte din categoria:","o":["Metodelor de vânătoare individuală","Metodelor de vânătoare colectivă, în grup restrâns","Metodelor de vânătoare colectivă, în grup mare"],"a":0},{"n":935,"c":"VIII","q":"Vânătoarea la pândă, după asfințitul soarelui, este admisă la:","o":["Căprior și iepure","Cerb și viezure","Vulpe și fazan"],"a":1},{"n":936,"c":"VIII","q":"Vânătoarea la pândă, înainte de răsăritul soarelui, este admisă la:","o":["Iepure și căprior","Gâște și rațe sălbatice","Fazan și potârniche"],"a":1},{"n":937,"c":"VIII","q":"Vânătoarea la dibuit este admisă la:","o":["Cervide și capră neagră","Potârniche și prepeliță","Iepure și fazan"],"a":0},{"n":938,"c":"VIII","q":"Vânătoare cu chemătoarea se poate practica eficient la:","o":["Cerb comun, căprior și vulpe","Iepure, potârniche și fazan","Lapin, marmotă și castor"],"a":0},{"n":939,"c":"VIII","q":"Vânătoarea cu atrape se utilizează eficient la vânarea:","o":["Rațelor și gâștelor sălbatice","Iepurilor și vulpilor","Fazanilor și potârnichilor"],"a":0},{"n":940,"c":"VIII","q":"Vânătoarea la sărite se poate practica eficient la:","o":["Capră neagră și căprior","Ciori și coțofene","Fazani și potârnichi"],"a":2},{"n":941,"c":"VIII","q":"Vânătoarea în grup restrâns se poate practica utilizând (folosind):","o":["Câini de vânătoare, atrape și chemători","Hăitași și câinii acestora","Ogari, atrape și gonaci"],"a":0},{"n":942,"c":"VIII","q":"Conducerea vânătorii colective aparține:","o":["Exclusiv paznicului de vânătoare","Exclusiv organizatorului de vânătoare","Unui colectiv de organizare, din care fac parte paznicul de vânătoare și șeful grupei"],"a":1},{"n":943,"c":"VIII","q":"Vânătorile colective debutează obligatoriu cu:","o":["Un instructaj despre cum va fi tran  vânătoare este permisă utilizarea alicelor cu diametrul de 9 mm?","o":["Da, numai la specia urs","Da, numai la speciile speciile cerb comun si mistreț","Nu, fără excepții"],"a":2},{"n":974,"c":"VIII","q":"Se poate practica vânătoarea de la apusul la răsăritul soarelui în baza autorizațiilor de vânătoare colective tip B (grup mare)?","o":["Da, pentru specia mistreț","Nu, fără excepții","Da, pentru speciile de păsări de pasaj"],"a":1},{"n":975,"c":"VIII","q":"Se poate practica vânătoarea de la apusul la răsăritul soarelui în baza autorizației de vânătoare colective tip A (grup restrâns):","o":["Da, pentru fazani și potârnichi","Nu, fără excepții","Da, pentru rațe și gâște admise la vânătoare"],"a":2},{"n":976,"c":"VIII","q":"Se poate practica vânătoarea de la apusul la răsăritul soarelui în baza autorizației de vânătoare individuale:","o":["Da, pentru capră neagră","Nu, fără excepții","Da, pentru căprior și cerb comun"],"a":2},{"n":977,"c":"VIII","q":"Pentru exercitarea vânătorii cu arme de foc poate fi folosită orice tip de muniție?","o":["Da, fără restricții","Da, numai pentru vânatul mare","Nu, doar munițiile admise la vânătoare corespunzătoare tipului si calibrului armei admise pentru specia respectivă"],"a":2},{"n":978,"c":"VIII","q":"Este admisă practicarea vânătorii pe timp de furtună?","o":["Da, dacă vânătorii sunt echipați corespunzător","Da, atunci când vânatoarea a început pe vreme bună","Nu, fără excepții"],"a":2},{"n":979,"c":"VIII","q":"În timpul repausului vânătorilor, arma de vânătoare se păstrează:","o":["Încărcată și agățată în arbori pentru a fi ferită de câini","Încărcată, sprijinită de raniță sau de un autovehicul","Descărcată, asezată în locuri care oferă o bună stabilitate și siguranță"],"a":2},{"n":980,"c":"VIII","q":"Declanșarea focului asupra vânatului se face:","o":["Imediat ce vânătorul a observat mișcarea vegetației în sectorul său de tragere","Când vecinul de stand i-a semnalat vânatul","Numai după ce vânătorul a identificat clar vânatul, iar pe direcția lui de tragere nu pune în pericol viața unei persoane"],"a":2},{"n":981,"c":"VIII","q":"Vânătoarea din barcă se realizează astfel:","o":["Vânătorul se așează cu spatele la barcagiu, arma îndreptată cu țevile în sus, tirul se realizează numai în față și lateral","Vânătorul se așează cu fața la barcagiu, arma cu țevile în jos, tirul se realizează pe deasupra capului barcagiului","Vânătorul se așează langă barcagiu, arma cu țevile îndreptate în sus, tirul se realizează pe direcția din care apare vânatul"],"a":0},{"n":982,"c":"VIII","q":"Deplasarea vânătorilor în teren, între goane, se realizează astfel:","o":["În formație de trei coloane","În grupuri de 3-5 vânători, la distanță de maxim 10 m între ele","În șir indian, în liniște"],"a":2},{"n":983,"c":"VIII","q":"Pentru executarea tirului asupra vânatului care a trecut linia standurilor se procedează astfel:","o":["Se trece arma încărcată peste linia standului, cu țeava în sus, apoi se execută tirul","Organizatorul desemnează vânătorii care vor executa tirul în astfel de situații","Nu se execută tir în astfel de situații"],"a":0},{"n":984,"c":"VIII","q":"Dreptul de a vâna al persoanelor înscrise în autorizațiile de vânătoare individuale se pierde dacă:","o":["Autorizațiile sunt expirate, prezintă modificări de formă sau conținut, vânătoarea se desfășoară în afara perioadei legale, vânătorul este surprins în fondul cinegetic neînsoțit de organizator","Vânătorul a executat foc greșit de trei ori","Vânătorul a rănit două exemplare de vânat"],"a":0},{"n":985,"c":"VIII","q":"Autorizația de vânătoare reprezintă:","o":["Documentul tip, eliberat de gestionar, pe baza căruia poate fi desfășurată acțiunea de vânătoare","Aprobarea dată unui vânător, de către directorul asociației de vânătoare, de a efectua acțiuni de vânătoare","Aprobarea scrisă dată unei persoane, de către paznicul de vânătoare sau de către organizatorul acțiunii de vânătoare, de a împușca anumite exemplare ce aparțin speciilor la care vânarea este permisă"],"a":0},{"n":986,"c":"VIII","q":"Instructajul privind protecția muncii și semnarea individuală a procesului verbal trebuie realizate obligatoriu:","o":["Înainte de începerea acțiunii de vânătoare","La eliberarea autorizației de vânătoare","În standul de vânătoare"],"a":0},{"n":987,"c":"VIII","q":"Armele de vânătoare pot fi transportate, de la domiciliul sau reședința vânătorului la locul unde urmează să participe la vânătoare și invers, în următoarele condiții:","o":["Frânte ori cu închizătorul deschis, după caz","Ținute în toc și neîncărcate cu muniție","Închise într-o cutie specială fixată în mijlocul de transport "],"a":1},{"n":988,"c":"VIII","q":"La vânătoarea cu gonaci, ridicarea vânatului se face:","o":["În timpul desfășurării goanei","După terminarea goanei","Oricând"],"a":1},{"n":989,"c":"VIII","q":"Vânatul mare rănit se urmărește:","o":["Imediat, pentru a i se da lovitura de grație și a i se curma cât mai repede chinurile","După 1-2 ore, pentru a se așeza și a se „răci”","Doar a doua zi, cu un câine limier bine dresat"],"a":1},{"n":990,"c":"VIII","q":"Pentru practicarea vânătorii la rațe și gâște sunt admise a se folosi următoarele:","o":["Rațe sau gâște domestice vii","Mulaje de rațe și gâște (atrape)","Chemători electronice"],"a":1},{"n":991,"c":"VIII","q":"Câte autorizații colective tip B (în grup mare) se pot elibera pe un fond cinegetic în aceeași zi:","o":["O singură autorizație","Maxim două autorizații","Maxim trei autorizații"],"a":1},{"n":992,"c":"VIII","q":"După vânătoare, până la obținerea rezultatelor examenelor de laborator pentru pesta porcină, mistreții recoltați se păstrează astfel:","o":["Eviscerați și refrigerați","Eviscerați și congelați","Tranșați și congelați"],"a":0},{"n":993,"c":"VIII","q":"În vânat se trage atunci când acesta:","o":["A fost zărit și bine localizat după zgomot","A fost bine identificat și se află la o distanța corespunzatoare unui tir eficient","Se îndreaptă spre vecin și se găsește la limita unui foc eficient"],"a":1},{"n":994,"c":"VIII","q":"Eviscerarea iepurilor se face tradițional prin practicarea:","o":["Unei tăieturi lungi de la anus până la gât","Unei tăieturi scurte de la anus până la stern","Unei tăieturi scurte, cât să încapă mâna, transversal la baza abdomenului"],"a":2},{"n":995,"c":"VIII","q":"Răcirea vânatului mare eviscerat este indicat să fie făcută:","o":["Așezat pe spate pe o pardoseală rece","Atârnat în aer, la umbră, cu cavitatea abdominală deschisă","Așezat pe spate, pe zăpadă sau pe gheață"],"a":1},{"n":996,"c":"VIII","q":"Vânatul mare eviscerat se curăță de sânge prin:","o":["Ștergere cu cârpe uscate","Ștergere cu cârpe ude","Spălare cu apă rece și ștergere cu cârpe uscate"],"a":0},{"n":997,"c":"VIII","q":"Înainte de încărcare, țeava armei de vânătoare se verifică pentru a vedea dacă:","o":["Nu este ruginită","Nu are corpuri străine în interior","Nu prezintă urme de lovituri vizibile"],"a":1},{"n":998,"c":"VIII","q":"Carabinele se încarcă ținându-se cu țeava:","o":["În jos","La orizontală","În sus"],"a":2},{"n":999,"c":"VIII","q":"Pentru prevenirea pagubelor pe care cioara grivă și coțofana le produc efectivelor de fazani, cea mai eficientă metodă admisă de lege pentru recoltarea acestora este:","o":["Recoltarea cu arma de vânătoare","Combaterea cu stricnina","Combaterea cu letolina"],"a":0},{"n":1000,"c":"VIII","q":"Pentru scoaterea vulpilor din vizuini se poate folosi eficient următoarea metodă admisă de lege:","o":["Inundarea vizuinilor","Introducerea de câini scotocitori in vizuini","Gazarea vizuinilor"],"a":1}];window.IMGS={};window.STEMA="stema.webp";</script>
<script>/* Chestionar examen vânător – AJVPS Caraș-Severin
   Logică comună pentru aplicația de calculator și cea de mobil.
   Variabile injectate la build: window.QDATA, window.IMGS, window.STEMA, window.MOBILE */
(function () {
  'use strict';
  const MOBILE = !!window.MOBILE;
  const Q = window.QDATA;
  const byN = {}; Q.forEach(q => (byN[q.n] = q));
  const IMG = window.IMGS || {};
  const STEMA = window.STEMA;

  const CH = [
    { k: 'IA', name: 'Biologie – mamifere mari', grp: 'Cap. I.A' },
    { k: 'IB', name: 'Biologie – mamifere mici', grp: 'Cap. I.B' },
    { k: 'IC', name: 'Biologie – păsări', grp: 'Cap. I.C' },
    { k: 'II', name: 'Legislație în domeniul cinegetic', grp: 'Cap. II' },
    { k: 'III', name: 'Etică vânătorească', grp: 'Cap. III' },
    { k: 'IV', name: 'Chinologie', grp: 'Cap. IV' },
    { k: 'V', name: 'Boli ale vânatului', grp: 'Cap. V' },
    { k: 'VI', name: 'Arme, muniții și echipamente', grp: 'Cap. VI' },
    { k: 'VII', name: 'Managementul speciilor de interes vânătoresc', grp: 'Cap. VII' },
    { k: 'VIII', name: 'Organizarea și practicarea vânătorii', grp: 'Cap. VIII' }
  ];
  const chByK = {}; CH.forEach(c => { c.qs = Q.filter(q => q.c === c.k).map(q => q.n); chByK[c.k] = c; });

  // Regulile examenului (Ordinul 539/2009, modificat prin Ordinul 302/2014)
  const EXAM = { count: 30, minutes: 60, pass: 20 };
  // Distribuție proporțională cu ponderea capitolelor în setul oficial de 1000 de întrebări
  const QUOTA = { IA: 7, IB: 3, IC: 5, II: 3, III: 1, IV: 1, V: 1, VI: 1, VII: 4, VIII: 4 };

  /* ---------- utilitare ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const sample = (a, n) => shuffle(a).slice(0, n);
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const L = ['A', 'B', 'C'];
  const fmtTime = s => { s = Math.max(0, Math.round(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const fmtDate = t => new Date(t).toLocaleString('ro-RO', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  /* ---------- distribuire pe Facebook (doar când aplicația e publicată pe un site) ---------- */
  const SITE = /^https?:/.test(location.protocol) ? location.href.split(/[?#]/)[0].replace(/(mobil|calculator)\/(index\.html)?$/, '').replace(/index\.html$/, '') : null;
  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.classList.add('out'), 3200); setTimeout(() => t.remove(), 3700);
  }
  async function share(text) {
    if (!SITE) return;
    const full = text + ' ' + SITE;
    if (MOBILE && navigator.share) { try { await navigator.share({ title: 'Chestionar examen vânător – AJVPS Caraș-Severin', text, url: SITE }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(full); toast('Textul a fost copiat — lipește-l în postarea de Facebook.'); } catch (e) {}
    window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(SITE), 'fbshare', 'width=640,height=560');
  }
  const shareBtn = (txt, label, cls) => SITE ? `<button class="btn fb ${cls || ''}" data-share="${esc(txt)}"><span class="fbi">f</span>${label}</button>` : '';
  document.addEventListener('click', e => { const b = e.target.closest('[data-share]'); if (b) { e.stopPropagation(); share(b.dataset.share); } }, true);

  /* ---------- stocare locală ---------- */
  const KEY = 'ajvps-cs-chestionar-v1';
  let S = { ans: {}, wrong: [], exams: [], cur: null, opt: { distrib: 'prop', send: true }, out: [] };
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
  if (S.opt.send === undefined) S.opt.send = true; if (!Array.isArray(S.out)) S.out = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  /* ---------- statistici anonime: rezultatul simulării se trimite fără nume sau alte date personale ---------- */
  const STATS = window.STATS_URL || '';
  const PLAT = window.PLATFORM || (MOBILE ? 'mobil' : 'pc');
  const APPV = '1.1';
  let sending = false;
  function queueStats(R) {
    if (!STATS || !S.opt.send) return;
    S.out.push({ k: 'ajvps-cs-examen', v: APPV, p: PLAT, dur: R.dur, to: R.timeout ? 1 : 0,
      ans: R.ids.map(n => [n, R.ans[n] == null ? -1 : R.ans[n]]) });
    S.out = S.out.slice(-20); save(); flushStats();
  }
  async function flushStats() {
    if (!STATS || sending || !S.out.length || navigator.onLine === false) return;
    sending = true;
    try {
      while (S.out.length) {
        await fetch(STATS, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(S.out[0]) });
        S.out.shift(); save();
      }
    } catch (e) { /* fără internet: se reîncearcă mai târziu */ }
    sending = false;
  }
  window.addEventListener('online', flushStats);
  setTimeout(flushStats, 6000);

  function record(n, ok) {
    const r = S.ans[n] || (S.ans[n] = [0, 0]);
    r[ok ? 0 : 1]++;
    const i = S.wrong.indexOf(n);
    if (ok && i >= 0) S.wrong.splice(i, 1);
    if (!ok && i < 0) S.wrong.push(n);
  }
  const known = n => S.ans[n] && S.ans[n][0] > 0;

  /* ---------- generare test ---------- */
  function buildExam() {
    let ids;
    if (S.opt.distrib === 'rand') ids = sample(Q.map(q => q.n), EXAM.count);
    else { ids = []; CH.forEach(c => ids.push(...sample(c.qs, QUOTA[c.k]))); ids = shuffle(ids); }
    return ids;
  }

  /* ---------- randare generală ---------- */
  const app = () => $('#app');
  let view = 'home', timerH = null, keyH = null;
  function setKeys(fn) { keyH = fn; }
  document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (keyH) keyH(e); });

  function go(v, arg) {
    clearInterval(timerH); timerH = null; keyH = null; view = v;
    document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === v || (v === 'learn' && b.dataset.nav === 'chapters')));
    ({ home, chapters, learn, exam, result, search, stats, about })[v](arg);
    const m = $('#main'); if (m) m.scrollTop = 0; window.scrollTo(0, 0);
  }

  function imgHTML(q) {
    if (!q.img) return '';
    const src = IMG[q.img] || q.img;
    return `<figure class="qimg"><img src="${src}" alt="Imagine la întrebarea ${q.n}" data-zoom><figcaption>${MOBILE ? 'Atinge' : 'Click pe'} imagine pentru mărire</figcaption></figure>`;
  }
  function chTag(q) { const c = chByK[q.c]; return `<span class="tag">${c.grp} · ${esc(c.name)}</span>`; }

  function qCard(q, opts) {
    // opts: {chosen, reveal, numLabel}
    const o = q.o.map((t, i) => {
      let cls = 'opt';
      if (opts.chosen === i) cls += ' chosen';
      if (opts.reveal) { if (i === q.a) cls += ' ok'; else if (opts.chosen === i) cls += ' bad'; }
      return `<button class="${cls}" data-opt="${i}" ${opts.reveal ? 'disabled' : ''}><span class="let">${L[i]}</span><span class="txt">${esc(t)}</span></button>`;
    }).join('');
    return `<article class="qcard">
      <div class="qmeta"><span class="qnum">${opts.numLabel || ''}</span>${chTag(q)}<span class="qid">nr. ${q.n}/1000</span></div>
      <h2 class="qtext">${esc(q.q)}</h2>${imgHTML(q)}
      <div class="opts">${o}</div></article>`;
  }

  // dialog propriu (alert/confirm nu sunt permise în toate mediile)
  function dialog(title, body, buttons) {
    return new Promise(res => {
      const d = document.createElement('div'); d.className = 'modal';
      d.innerHTML = `<div class="mbox" role="dialog" aria-modal="true"><h3>${title}</h3><p>${body}</p><div class="mbtn">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.t}</button>`).join('')}</div></div>`;
      d.addEventListener('click', e => { const i = e.target.dataset.i; if (i != null) { d.remove(); res(+i); } else if (e.target === d) { d.remove(); res(-1); } });
      document.body.appendChild(d); d.querySelector('.btn:last-child').focus();
    });
  }
  // mărire imagine
  document.addEventListener('click', e => {
    if (e.target.matches('[data-zoom]')) {
      const d = document.createElement('div'); d.className = 'lightbox';
      d.innerHTML = `<img src="${e.target.src}" alt=""><span>×</span>`; d.onclick = () => d.remove();
      document.body.appendChild(d);
    }
  });

  /* ---------- ACASĂ ---------- */
  function home() {
    if (S.cur && S.cur.end <= Date.now()) finishExam(true, true);
    const ex = S.exams, passed = ex.filter(x => x.pass).length;
    const best = ex.length ? Math.max(...ex.map(x => x.score)) : null;
    const learned = Q.filter(q => known(q.n)).length;
    const cur = S.cur;
    app().innerHTML = `
    <section class="hero">
      <img class="hero-logo" src="${STEMA}" alt="Stema AJVPS Caraș-Severin">
      <div><p class="eyebrow">A.J.V.P.S. Caraș-Severin</p>
      <h1>Chestionar pentru examenul de vânător</h1>
      <p class="lead">Setul oficial de 1000 de întrebări, actualizat conform Legii nr. 171/2022. Test de ${EXAM.count} întrebări, ${EXAM.minutes} de minute, promovare cu minimum ${EXAM.pass} răspunsuri corecte.</p></div>
    </section>
    ${cur ? `<button class="resume" data-act="resume"><b>Ai o simulare în desfășurare</b><span>${Object.keys(cur.ans).length}/${EXAM.count} răspunsuri · timp rămas ${fmtTime((cur.end - Date.now()) / 1000)} — Continuă ›</span></button>` : ''}
    <div class="kpis">
      <div class="kpi"><b>${learned}</b><span>întrebări știute din 1000</span><i style="--p:${learned / 10}%"></i></div>
      <div class="kpi"><b>${ex.length}</b><span>simulări susținute</span></div>
      <div class="kpi"><b>${ex.length ? Math.round(passed / ex.length * 100) + '%' : '–'}</b><span>rată de promovare</span></div>
      <div class="kpi"><b>${best != null ? best + '/30' : '–'}</b><span>cel mai bun rezultat</span></div>
    </div>
    <div class="tiles">
      <button class="tile big" data-act="exam"><span class="ic">⏱</span><b>Simulare examen</b><span>30 de întrebări alese aleatoriu, 60 de minute, rezultat ADMIS / RESPINS</span></button>
      <button class="tile" data-act="chapters"><span class="ic">📖</span><b>Învățare pe capitole</b><span>Vezi imediat răspunsul corect</span></button>
      <button class="tile" data-act="random"><span class="ic">🎲</span><b>Întrebări aleatorii</b><span>Exersare continuă din toate capitolele</span></button>
      <button class="tile" data-act="wrong"><span class="ic">✗</span><b>Greșelile mele</b><span>${S.wrong.length ? S.wrong.length + ' întrebări de refăcut' : 'Nicio greșeală salvată'}</span></button>
      <button class="tile" data-act="unseen"><span class="ic">◎</span><b>Neînvățate</b><span>${1000 - learned} întrebări la care încă nu ai răspuns corect</span></button>
      ${MOBILE ? '' : `<button class="tile" data-act="search"><span class="ic">⌕</span><b>Caută întrebare</b><span>După cuvinte din întrebare sau răspuns</span></button>`}
      <button class="tile" data-act="stats"><span class="ic">▤</span><b>Statistici & istoric</b><span>Progres pe capitole și simulări</span></button>
      ${MOBILE ? `<button class="tile" data-act="about"><span class="ic">ⓘ</span><b>Despre examen</b><span>Reguli, punctaj, setări</span></button>` : ''}
    </div>
    ${STATS ? `<label class="optin"><input type="checkbox" id="optin" ${S.opt.send ? 'checked' : ''}><span>Trimite anonim rezultatele simulărilor către A.J.V.P.S. Caraș-Severin, pentru statistici (fără nume sau alte date personale).</span></label>` : ''}
    ${SITE ? `<div class="sharerow"><span>Te pregătești cu prietenii? Recomandă-le chestionarul.</span>${shareBtn('Chestionar gratuit pentru examenul de vânător – cele 1000 de întrebări oficiale, simulări de 30 de întrebări cu cronometru. De la A.J.V.P.S. Caraș-Severin:', 'Distribuie pe Facebook')}</div>` : ''}`;
    const oi = $('#optin'); if (oi) oi.onchange = () => { S.opt.send = oi.checked; if (!oi.checked) S.out = []; save(); };
    app().onclick = e => {
      const a = e.target.closest('[data-act]'); if (!a) return;
      const act = a.dataset.act;
      if (act === 'exam') startExam();
      else if (act === 'resume') go('exam');
      else if (act === 'chapters') go('chapters');
      else if (act === 'random') go('learn', { title: 'Întrebări aleatorii', ids: shuffle(Q.map(q => q.n)) });
      else if (act === 'wrong') { if (S.wrong.length) go('learn', { title: 'Greșelile mele', ids: shuffle(S.wrong), wrongMode: true }); else dialog('Greșelile mele', 'Nu ai încă greșeli salvate. Întrebările la care răspunzi greșit apar aici până le rezolvi corect.', [{ t: 'Am înțeles', cls: 'pri' }]); }
      else if (act === 'unseen') go('learn', { title: 'Întrebări neînvățate', ids: shuffle(Q.filter(q => !known(q.n)).map(q => q.n)) });
      else go(act);
    };
  }

  /* ---------- CAPITOLE ---------- */
  function chapters() {
    app().innerHTML = `<header class="phead"><h1>Învățare pe capitole</h1><p>Alege un capitol. La fiecare întrebare vezi imediat răspunsul corect.</p>
      <div class="seg" role="group"><button class="on" data-ord="seq">În ordine</button><button data-ord="rnd">Aleatoriu</button></div></header>
      <div class="chlist">${CH.map(c => {
        const k = c.qs.filter(known).length, p = Math.round(k / c.qs.length * 100);
        return `<button class="chrow" data-ch="${c.k}"><span class="chg">${c.grp}</span><span class="chn">${esc(c.name)}</span>
        <span class="chc">${k}/${c.qs.length}</span><span class="bar"><i style="width:${p}%"></i></span></button>`;
      }).join('')}</div>`;
    let ord = 'seq';
    app().onclick = e => {
      const o = e.target.closest('[data-ord]');
      if (o) { ord = o.dataset.ord; app().querySelectorAll('[data-ord]').forEach(b => b.classList.toggle('on', b === o)); return; }
      const r = e.target.closest('[data-ch]'); if (!r) return;
      const c = chByK[r.dataset.ch];
      go('learn', { title: c.grp + ' – ' + c.name, ids: ord === 'rnd' ? shuffle(c.qs) : c.qs.slice() });
    };
  }

  /* ---------- SESIUNE DE ÎNVĂȚARE ---------- */
  function learn(cfg) {
    let i = 0, chosen = null, ok = 0, bad = 0;
    const ids = cfg.ids;
    if (!ids.length) { app().innerHTML = `<div class="empty"><h2>Nimic de exersat aici</h2><p>Felicitări — toate întrebările din această categorie au fost rezolvate corect.</p><button class="btn pri" data-back>Înapoi</button></div>`; app().onclick = e => { if (e.target.dataset.back != null) go('home'); }; return; }
    function draw() {
      if (i >= ids.length) return done();
      const q = byN[ids[i]];
      app().innerHTML = `<header class="sesh"><button class="back" data-back aria-label="Înapoi">‹</button><div><b>${esc(cfg.title)}</b><span>${i + 1} / ${ids.length} · <em class="g">✓ ${ok}</em> <em class="r">✗ ${bad}</em></span></div></header>
      <div class="prog"><i style="width:${i / ids.length * 100}%"></i></div>
      ${qCard(q, { chosen, reveal: chosen != null, numLabel: 'Întrebarea ' + (i + 1) })}
      <div class="feedback">${chosen == null ? `<p class="hint">${MOBILE ? 'Atinge varianta corectă.' : 'Alege răspunsul (tastele 1–3 sau A–C).'}</p>` :
        (chosen === q.a ? `<p class="fb ok">Corect!</p>` : `<p class="fb bad">Greșit — răspunsul corect este <b>${L[q.a]}</b>.</p>`)}
      <div class="nav"><button class="btn" data-prev ${i ? '' : 'disabled'}>‹ Anterioara</button>
      <button class="btn pri" data-next>${chosen == null ? 'Sari peste ›' : (i + 1 < ids.length ? 'Următoarea ›' : 'Termină')}</button></div></div>`;
    }
    function pick(k) {
      if (chosen != null) return; const q = byN[ids[i]]; chosen = k;
      const good = k === q.a; record(q.n, good); good ? ok++ : bad++; save(); draw();
      if (MOBILE && navigator.vibrate && !good) try { navigator.vibrate(60); } catch (e) {}
    }
    function next() { i++; chosen = null; draw(); }
    function done() {
      const tot = ok + bad;
      app().innerHTML = `<div class="empty"><h2>Sesiune încheiată</h2><p>${esc(cfg.title)}: ${ok} corecte din ${tot} răspunsuri${tot ? ` (${Math.round(ok / tot * 100)}%)` : ''}.</p>
      <div class="nav center"><button class="btn" data-home>Acasă</button><button class="btn pri" data-again>Reia</button></div></div>`;
    }
    app().onclick = e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.opt != null) pick(+t.dataset.opt);
      else if (t.dataset.next != null) next();
      else if (t.dataset.prev != null) { i = Math.max(0, i - 1); chosen = null; draw(); }
      else if (t.dataset.back != null || t.dataset.home != null) go(cfg.back || 'home');
      else if (t.dataset.again != null) go('learn', Object.assign({}, cfg, { ids: cfg.wrongMode ? shuffle(S.wrong) : shuffle(cfg.ids) }));
    };
    setKeys(e => {
      const k = e.key.toLowerCase(), m = { '1': 0, '2': 1, '3': 2, a: 0, b: 1, c: 2 };
      if (k in m) pick(m[k]); else if (k === 'enter' || k === 'arrowright') next(); else if (k === 'arrowleft' && i) { i--; chosen = null; draw(); }
    });
    swipe(() => next(), () => { if (i) { i--; chosen = null; draw(); } });
    draw();
  }

  /* ---------- SIMULARE EXAMEN ---------- */
  function startExam() {
    if (S.cur && S.cur.end > Date.now()) return go('exam');
    S.cur = { ids: buildExam(), ans: {}, start: Date.now(), end: Date.now() + EXAM.minutes * 60000, i: 0, later: [] };
    save(); go('exam');
  }
  function exam() {
    const E = S.cur; if (!E) return go('home');
    function draw() {
      const q = byN[E.ids[E.i]], n = Object.keys(E.ans).length;
      const grid = E.ids.map((id, k) => `<button class="cell ${E.ans[id] != null ? 'done' : ''} ${k === E.i ? 'cur' : ''} ${E.later.includes(id) && E.ans[id] == null ? 'later' : ''}" data-go="${k}">${k + 1}</button>`).join('');
      app().innerHTML = `<div class="exam ${MOBILE ? 'm' : 'd'}">
        <header class="exhead"><div class="exttl"><b>Simulare examen</b><span>${n}/${EXAM.count} răspunsuri</span></div>
          <div class="timer" id="timer">${fmtTime((E.end - Date.now()) / 1000)}</div>
          <button class="btn sm" data-finish>Predă testul</button></header>
        <div class="prog"><i style="width:${n / EXAM.count * 100}%"></i></div>
        <div class="exbody"><div class="excol">
          ${qCard(q, { chosen: E.ans[q.n], reveal: false, numLabel: `Întrebarea ${E.i + 1} din ${EXAM.count}` })}
          <div class="nav"><button class="btn" data-prev ${E.i ? '' : 'disabled'}>‹ Anterioara</button>
            <button class="btn ghost" data-later>Răspund mai târziu</button>
            <button class="btn pri" data-next>${E.i + 1 < EXAM.count ? 'Următoarea ›' : 'Finalizează'}</button></div>
        </div>
        <aside class="grid"><p>Întrebări</p><div class="cells">${grid}</div>
          <p class="legend"><i class="lg done"></i>răspuns <i class="lg later"></i>mai târziu <i class="lg"></i>fără răspuns</p></aside></div></div>`;
    }
    function tick() {
      const left = (E.end - Date.now()) / 1000, t = $('#timer');
      if (t) { t.textContent = fmtTime(left); t.classList.toggle('warn', left < 300); }
      if (left <= 0) finishExam(true);
    }
    function move(k) { E.i = (k + EXAM.count) % EXAM.count; save(); draw(); }
    function nextUnanswered() {
      for (let s = 1; s <= EXAM.count; s++) { const k = (E.i + s) % EXAM.count; if (E.ans[E.ids[k]] == null) return move(k); }
      askFinish();
    }
    async function askFinish() {
      const left = EXAM.count - Object.keys(E.ans).length;
      const r = await dialog('Predai testul?', left ? `Mai ai <b>${left}</b> întrebări fără răspuns. Acestea vor fi considerate greșite.` : 'Ai răspuns la toate întrebările. Poți preda testul pentru corectare.', [{ t: 'Continui testul' }, { t: 'Predau testul', cls: 'pri' }]);
      if (r === 1) finishExam(false);
    }
    app().onclick = e => {
      const t = e.target.closest('button'); if (!t) return;
      const q = byN[E.ids[E.i]];
      if (t.dataset.opt != null) { E.ans[q.n] = +t.dataset.opt; E.later = E.later.filter(x => x !== q.n); save(); draw(); setTimeout(() => { if (view === 'exam' && S.cur === E) nextUnanswered(); }, MOBILE ? 380 : 300); }
      else if (t.dataset.next != null) { if (E.i + 1 < EXAM.count) move(E.i + 1); else askFinish(); }
      else if (t.dataset.prev != null) move(E.i - 1);
      else if (t.dataset.later != null) { if (!E.later.includes(q.n) && E.ans[q.n] == null) E.later.push(q.n); nextUnanswered(); }
      else if (t.dataset.go != null) move(+t.dataset.go);
      else if (t.dataset.finish != null) askFinish();
    };
    setKeys(e => {
      const k = e.key.toLowerCase(), m = { '1': 0, '2': 1, '3': 2, a: 0, b: 1, c: 2 };
      if (k in m) { const b = app().querySelector(`[data-opt="${m[k]}"]`); if (b) b.click(); }
      else if (k === 'arrowright') move(E.i + 1); else if (k === 'arrowleft') move(E.i - 1);
    });
    swipe(() => move(E.i + 1), () => move(E.i - 1));
    draw(); timerH = setInterval(tick, 1000);
  }
  function finishExam(timeout, silent) {
    const E = S.cur; if (!E) return;
    const per = {}; let score = 0;
    E.ids.forEach(n => { const q = byN[n], ok = E.ans[n] === q.a; if (ok) score++; record(n, ok); const p = per[q.c] || (per[q.c] = [0, 0]); p[0] += ok; p[1]++; });
    const res = { t: Date.now(), ids: E.ids, ans: E.ans, score, pass: score >= EXAM.pass, dur: Math.min(EXAM.minutes * 60, Math.round((Math.min(Date.now(), E.end) - E.start) / 1000)), timeout: !!timeout, per };
    S.exams.unshift(res); S.exams = S.exams.slice(0, 50); S.cur = null; save();
    queueStats(res);
    if (!silent) go('result', res);
  }

  /* ---------- REZULTAT ---------- */
  function result(R) {
    let filter = 'all';
    function draw() {
      const list = R.ids.map((n, k) => ({ q: byN[n], k, ch: R.ans[n] })).filter(x => filter === 'all' || x.ch !== x.q.a);
      app().innerHTML = `<section class="verdict ${R.pass ? 'pass' : 'fail'}">
        <div class="vbadge">${R.pass ? 'ADMIS' : 'RESPINS'}</div>
        <div class="vscore"><b>${R.score}</b><span>/ ${EXAM.count} răspunsuri corecte</span></div>
        <p>${R.pass ? 'Ai trecut pragul de ' + EXAM.pass + ' răspunsuri corecte.' : 'Pentru promovare sunt necesare minimum ' + EXAM.pass + ' răspunsuri corecte (ți-au lipsit ' + (EXAM.pass - R.score) + ').'}
        Timp folosit: ${fmtTime(R.dur)}${R.timeout ? ' — timpul a expirat' : ''}.</p>
        <div class="nav center"><button class="btn" data-home>Acasă</button><button class="btn pri" data-new>Simulare nouă</button>
        ${shareBtn(`Am obținut ${R.score}/30 – ${R.pass ? 'ADMIS' : 'RESPINS'} la simularea examenului de vânător (A.J.V.P.S. Caraș-Severin). Încearcă și tu chestionarul:`, 'Distribuie rezultatul')}</div>
      </section>
      <section class="perch"><h3>Rezultat pe capitole</h3>${CH.filter(c => R.per[c.k]).map(c => { const p = R.per[c.k]; return `<div class="pc"><span>${c.grp} · ${esc(c.name)}</span><b>${p[0]}/${p[1]}</b><span class="bar"><i style="width:${p[0] / p[1] * 100}%"></i></span></div>`; }).join('')}</section>
      <section class="review"><div class="rvh"><h3>Verificarea răspunsurilor</h3><div class="seg"><button data-f="all" class="${filter === 'all' ? 'on' : ''}">Toate (${R.ids.length})</button><button data-f="bad" class="${filter === 'bad' ? 'on' : ''}">Greșite (${EXAM.count - R.score})</button></div></div>
      ${list.map(x => `<div class="rv ${x.ch === x.q.a ? 'okk' : 'badd'}"><div class="rvn">${x.k + 1}</div><div class="rvb">
        <p class="rvq">${esc(x.q.q)} <small>(nr. ${x.q.n})</small></p>${imgHTML(x.q)}
        ${x.q.o.map((t, i) => `<p class="rvo ${i === x.q.a ? 'c' : ''} ${i === x.ch && i !== x.q.a ? 'w' : ''}"><b>${L[i]}.</b> ${esc(t)}${i === x.q.a ? ' ✓' : ''}${i === x.ch && i !== x.q.a ? ' ✗ (răspunsul tău)' : ''}</p>`).join('')}
        ${x.ch == null ? '<p class="rvo w">Fără răspuns</p>' : ''}</div></div>`).join('')}</section>`;
    }
    app().onclick = e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.home != null) go('home'); else if (t.dataset.new != null) startExam();
      else if (t.dataset.f) { filter = t.dataset.f; draw(); }
    };
    draw();
  }

  /* ---------- CĂUTARE ---------- */
  function search() {
    app().innerHTML = `<header class="phead"><h1>Caută întrebare</h1>
      <div class="sbar"><input id="sq" type="search" placeholder="ex: căprior, permis, cartuș…" autocomplete="off">
      <select id="sc"><option value="">Toate capitolele</option>${CH.map(c => `<option value="${c.k}">${c.grp} – ${esc(c.name)}</option>`).join('')}</select></div></header><div id="sr"></div>`;
    const inp = $('#sq'), sel = $('#sc'), out = $('#sr');
    function run() {
      const t = norm(inp.value.trim()), c = sel.value;
      if (t.length < 2 && !c) { out.innerHTML = `<p class="hint">Scrie cel puțin 2 litere sau alege un capitol.</p>`; return; }
      const num = /^\d+$/.test(t) ? +t : null;
      const res = Q.filter(q => (!c || q.c === c) && (!t || q.n === num || norm(q.q + ' ' + q.o.join(' ')).includes(t)));
      out.innerHTML = `<p class="hint">${res.length} rezultate${res.length > 100 ? ' (se afișează primele 100)' : ''}</p>` + res.slice(0, 100).map(q => `<div class="rv"><div class="rvn">${q.n}</div><div class="rvb"><p class="rvq">${esc(q.q)}</p>${imgHTML(q)}${q.o.map((o, i) => `<p class="rvo ${i === q.a ? 'c' : ''}"><b>${L[i]}.</b> ${esc(o)}${i === q.a ? ' ✓' : ''}</p>`).join('')}</div></div>`).join('');
    }
    inp.oninput = run; sel.onchange = run; app().onclick = null; run(); if (!MOBILE) inp.focus();
  }

  /* ---------- STATISTICI ---------- */
  function stats() {
    const ex = S.exams;
    app().innerHTML = `<header class="phead"><h1>Statistici & istoric</h1><p>Datele sunt salvate doar pe acest dispozitiv, în acest browser.</p></header>
    <section class="perch"><h3>Progres pe capitole</h3>${CH.map(c => {
      let a = 0, w = 0, k = 0; c.qs.forEach(n => { const r = S.ans[n]; if (r) { a += r[0]; w += r[1]; if (r[0]) k++; } });
      return `<div class="pc"><span>${c.grp} · ${esc(c.name)}</span><b>${k}/${c.qs.length}</b><span class="bar"><i style="width:${k / c.qs.length * 100}%"></i></span><small>${a + w ? 'acuratețe ' + Math.round(a / (a + w) * 100) + '%' : 'neînceput'}</small></div>`;
    }).join('')}</section>
    <section class="perch"><h3>Simulări (${ex.length})</h3>${ex.length ? `<div class="hist">${ex.map((x, i) => `<button class="hrow" data-r="${i}"><span>${fmtDate(x.t)}</span><b class="${x.pass ? 'g' : 'r'}">${x.score}/30 · ${x.pass ? 'ADMIS' : 'RESPINS'}</b><span>${fmtTime(x.dur)}</span></button>`).join('')}</div>` : '<p class="hint">Nicio simulare încă.</p>'}</section>
    <div class="nav center"><button class="btn danger" data-reset>Șterge tot progresul</button></div>`;
    app().onclick = async e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.r != null) go('result', ex[+t.dataset.r]);
      if (t.dataset.reset != null) { const r = await dialog('Ștergi progresul?', 'Se vor șterge răspunsurile, greșelile salvate și istoricul simulărilor de pe acest dispozitiv.', [{ t: 'Renunț' }, { t: 'Șterge', cls: 'danger' }]); if (r === 1) { S = { ans: {}, wrong: [], exams: [], cur: null, opt: S.opt }; save(); go('stats'); } }
    };
  }

  /* ---------- DESPRE EXAMEN ---------- */
  function about() {
    app().innerHTML = `<header class="phead"><h1>Despre examen</h1></header><div class="prose">
      <h3>Cum se desfășoară proba teoretică</h3>
      <ul><li>Testul are <b>${EXAM.count} de întrebări</b> extrase din setul oficial de 1000 de întrebări.</li>
      <li>Fiecare întrebare are <b>3 variante de răspuns</b>, dintre care <b>una singură este corectă</b>.</li>
      <li>Timpul de lucru este de <b>${EXAM.minutes} de minute</b>.</li>
      <li>Sunt declarați promovați candidații care răspund corect la <b>minimum ${EXAM.pass} de întrebări</b>.</li></ul>
      <p>Temei: Regulamentul pentru obținerea permiselor de vânătoare (Ordinul nr. 539/2009, modificat prin Ordinul nr. 302/2014); setul de întrebări este cel publicat de Ministerul Mediului, actualizat conform Legii nr. 171/2022.</p>
      <h3>Cum alege aplicația întrebările</h3>
      <p>Regulamentul nu fixează câte întrebări vin din fiecare capitol. Implicit, aplicația extrage aleatoriu întrebări din fiecare capitol, proporțional cu ponderea lui în set, astfel încât fiecare simulare acoperă toată materia:</p>
      <p class="quota">${CH.map(c => `<span>${c.grp}: <b>${QUOTA[c.k]}</b></span>`).join('')}</p>
      <div class="seg wide"><button data-d="prop" class="${S.opt.distrib === 'prop' ? 'on' : ''}">Proporțional pe capitole</button><button data-d="rand" class="${S.opt.distrib === 'rand' ? 'on' : ''}">Complet aleatoriu din cele 1000</button></div>
      ${STATS ? `<h3>Statistici anonime</h3>
      <p>Dacă opțiunea de pe ecranul principal este bifată, la finalul fiecărei simulări aplicația trimite către A.J.V.P.S. Caraș-Severin numărul întrebărilor primite, variantele alese, timpul folosit și tipul aplicației. Nu se trimit nume, e-mail, telefon sau alte date care să te identifice. Datele sunt folosite doar pentru a vedea unde se greșește cel mai des și pentru a îmbunătăți pregătirea candidaților. Simulările din modul de învățare nu se trimit.</p>` : ''}
      <h3>Setul de întrebări pe capitole</h3>
      <ul>${CH.map(c => `<li>${c.grp} – ${esc(c.name)}: ${c.qs.length} întrebări</li>`).join('')}</ul>
      <p class="small">Aplicație de pregătire realizată pentru membrii și stagiarii A.J.V.P.S. Caraș-Severin. Nu înlocuiește examenul oficial; în caz de neconcordanță prevalează setul publicat de autoritatea publică centrală care răspunde de silvicultură.</p></div>`;
    app().onclick = e => { const t = e.target.closest('[data-d]'); if (!t) return; S.opt.distrib = t.dataset.d; save(); about(); };
  }

  /* ---------- gesturi pe mobil ---------- */
  let sw = null;
  function swipe(onLeft, onRight) { sw = { onLeft, onRight }; }
  if (MOBILE) {
    let x0 = null, y0 = null;
    document.addEventListener('touchstart', e => { if (e.target.closest('.lightbox,.modal')) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchend', e => {
      if (x0 == null || !sw || !['learn', 'exam'].includes(view)) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) (dx < 0 ? sw.onLeft : sw.onRight)();
    }, { passive: true });
  }

  /* ---------- pornire: stema 5 secunde ---------- */
  document.addEventListener('click', e => { const b = e.target.closest('[data-nav]'); if (!b) return; if (b.dataset.nav === 'exam') startExam(); else go(b.dataset.nav); });
  window.addEventListener('beforeunload', save);
  // butonul „Înapoi” din aplicația Android: revine la ecranul principal; pe ecranul principal închide aplicația
  window.__back = function () {
    if (document.querySelector('.lightbox')) { document.querySelector('.lightbox').remove(); return true; }
    if (document.querySelector('.modal')) { document.querySelector('.modal').remove(); return true; }
    if (view !== 'home') { go('home'); return true; }
    return false;
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  const splash = $('#splash');
  setTimeout(() => {
    splash.classList.add('out'); document.body.classList.remove('booting');
    setTimeout(() => splash.remove(), 700);
  }, 5000);
  go('home');
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
</body></html>
